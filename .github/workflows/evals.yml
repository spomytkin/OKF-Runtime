name: evals

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-evals:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -B -m unittest discover -s tests -p 'test_*.py'
      - name: Validate eval cases
        run: python -B -m okf_runtime.evals.cli cases validate
      - name: Reference eval suite
        run: python -B -m okf_runtime.evals.cli run --adapter reference --output .evals/results.json
      - name: Compare reference baseline
        run: python -B -m okf_runtime.evals.cli compare .evals/results.json --baseline evals/data/baseline.reference.json
